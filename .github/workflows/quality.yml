name: Quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Check types and plan
        run: |
          npm run typecheck
          npm run check:plan
          npm run check:governance
          npm run check:editorial
          npm run check:ui-contract
          npm run test:catalog-boundary
          npm run test:catalog-library
          npm run test:publication-management
          npm run test:runtime-environment
      - name: Build production site
        run: npm run build
      - name: Check public assets and isolated scenarios
        run: |
          npm run check:public-secrets
          npm run check:performance-budget
          node scripts/audit-plan-scenarios.mjs
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Test browser journeys
        run: npm run test:e2e
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: playwright-failure-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
