name: Isolated database contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.1"
          package-manager-cache: false
      - name: Install pinned Supabase CLI
        run: npm install --global supabase@2.115.0
      - name: Start isolated local database and apply migrations
        run: supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor --yes
      - name: Rebuild schema from migrations
        run: supabase db reset --local
      - name: Run database contracts
        run: supabase test db --local
      - name: Simulate concurrent database workers
        run: npm run test:database-concurrency
      - name: Reject schema lint warnings
        run: supabase db lint --local --level warning --fail-on warning
